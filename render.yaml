services:
  - type: web
    name: nexus-gemini-chat
    runtime: node
    plan: free
    rootDir: backend-render
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://brotex-dvplr.github.io
